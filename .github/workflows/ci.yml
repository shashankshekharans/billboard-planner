# Type-check, unit tests, builds and Playwright smoke tests on every push and pull request. Readable copy: docs/github-workflows/ci.yml
name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs: { test: { runs-on: ubuntu-latest, timeout-minutes: 20, steps: [ { uses: actions/checkout@v5 }, { uses: actions/setup-node@v5, with: { node-version: 24, cache: npm } }, { run: npm ci }, { run: npm run build }, { run: npm run typecheck }, { run: npm test }, { run: npm run build:app }, { run: npm run build:example }, { run: npx playwright install --with-deps chromium }, { run: npm run test:e2e, env: { CI: "true" } }, { uses: actions/upload-artifact@v4, if: failure(), with: { name: playwright-report, path: test-results/, retention-days: 7 } } ] } }
