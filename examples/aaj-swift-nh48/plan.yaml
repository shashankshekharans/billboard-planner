# AAJ Swift – NH-48 Billboard Plan (default example)
#
# ALL MONEY FIGURES ARE SAMPLE RATES FOR DEMONSTRATION. Never put real vendor rates here.
# Locations, sizes, coordinates, photos, logos and the warehouse are real and public.
#
# `coords` keeps each site's coordinates exactly as the vendor sent them, so this file
# also exercises the coordinate parser (decimal, "Lat … Long …", degree signs and DMS).
# Expected build output: reference/billboard-plan-example.html
# (8 sites · 8,250 sq ft · grand total ₹4,66,000 + Binalo printing + GST).

plan:
  title: Billboard Plan
  subtitle: Example plan · NH-48 corridor · Sample rates for demonstration
  logo: logos/aaj-swift.png
  currency: INR
  locale: en-IN
  theme: light
  brand: { primary: "#c1202d" }
  map:
    default_view: satellite
    providers: { satellite: esri-imagery, road: esri-street }
  bases:
    - id: warehouse
      name: AAJ Swift Warehouse
      lat: 28.24132198237465
      lng: 76.9355599373958
      marker_logo: logos/aaj-mark.png
      distance_from: true
  rings:
    center: { lat: 28.4595, lng: 77.0266, label: Gurgaon }
    radii_km: [20, 50]
    visible: true
  groups:
    - { id: hwy, name: Delhi Jaipur Highway, color: "#0f6b3e" }
    - { id: binalo, name: Binalo – Near Stella Showroom, color: "#c27a06" }
  notes:
    - Qty 1 per site. Rates are per month (D.C.P.M), booked for 30 days.
    - Printing & mounting is a one-time charge (black back).
    - Illum. N/L = non-lit. Distances are straight-line.
    - All rates and printing costs on this page are sample figures for demonstration, not real vendor quotes. Binalo shows how a cost marked "Extra" and GST notes appear.

sites:
  - id: "1"
    group: hwy
    media_vehicle: Hoarding
    location: Delhi Rd. Kasola Chowk Before Flyover
    facing: Jaipur
    coords: "28.135394, 76.650181"
    width_ft: 40
    height_ft: 30
    qty: 1
    illumination: N/L
    rate_per_month: 36000
    days: 30
